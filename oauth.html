<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход… — RYOTAMORI</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #14162b;
        color: #f2f1fa;
        font: 600 16px/1.5 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Завершаю вход…</p>
    <script>
      ;(function () {
        try {
          var q = new URLSearchParams(window.location.search)
          var h = new URLSearchParams(window.location.hash.replace(/^#/, ''))
          var result = null
          if (q.get('code')) {
            result = {
              provider: 'vk',
              code: q.get('code'),
              deviceId: q.get('device_id') || '',
            }
          } else if (h.get('access_token')) {
            result = { provider: 'ya', token: h.get('access_token') }
          }
          if (result) localStorage.setItem('animori-oauth-result', JSON.stringify(result))
        } catch (e) {
          /* просто вернёмся на главную */
        }
        window.location.replace('/')
      })()
    </script>
  </body>
</html>

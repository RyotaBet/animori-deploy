<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1440"/>
      <stop offset="0.45" stop-color="#3a2160"/>
      <stop offset="0.75" stop-color="#8e4a7a"/>
      <stop offset="1" stop-color="#ff9e7d"/>
    </linearGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3b6e"/>
      <stop offset="1" stop-color="#241a45"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a45"/>
      <stop offset="1" stop-color="#140f2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9e7d"/>
      <stop offset="0.55" stop-color="#ff5f9e"/>
      <stop offset="1" stop-color="#8e6bff"/>
    </linearGradient>
    <clipPath id="sq">
      <rect x="0" y="0" width="512" height="512" rx="118"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- звёзды -->
    <g fill="#f2f1fa">
      <circle cx="74" cy="84" r="3.2" opacity="0.9"/>
      <circle cx="140" cy="52" r="2.2" opacity="0.7"/>
      <circle cx="205" cy="92" r="1.8" opacity="0.6"/>
      <circle cx="425" cy="70" r="2.8" opacity="0.85"/>
      <circle cx="460" cy="130" r="1.8" opacity="0.6"/>
      <circle cx="352" cy="48" r="1.6" opacity="0.55"/>
      <circle cx="58" cy="182" r="1.8" opacity="0.5"/>
      <circle cx="470" cy="210" r="1.6" opacity="0.45"/>
    </g>

    <!-- луна -->
    <circle cx="404" cy="106" r="34" fill="#ffe9d6" opacity="0.95"/>
    <circle cx="392" cy="96" r="30" fill="url(#sky)" opacity="0.55"/>

    <!-- солнце-закат за замком -->
    <circle cx="256" cy="384" r="150" fill="#ff9e7d" opacity="0.35"/>
    <circle cx="256" cy="384" r="95" fill="#ffd0a6" opacity="0.4"/>

    <!-- Айнкрад: рваная скала снизу -->
    <path d="M256 470 L212 402 L232 408 L244 380 L256 398 L268 376 L282 406 L300 400 Z" fill="url(#rock)"/>
    <path d="M256 500 L238 420 L256 440 L274 416 Z" fill="url(#rock)"/>

    <!-- ярусы замка -->
    <g stroke="#8e6bff" stroke-opacity="0.35" stroke-width="2">
      <path d="M156 386 L356 386 L338 356 L174 356 Z" fill="url(#castle)"/>
      <path d="M176 356 L336 356 L320 326 L192 326 Z" fill="url(#castle)"/>
      <path d="M194 326 L318 326 L304 296 L208 296 Z" fill="url(#castle)"/>
      <path d="M212 296 L300 296 L288 266 L224 266 Z" fill="url(#castle)"/>
      <path d="M228 266 L284 266 L274 238 L238 238 Z" fill="url(#castle)"/>
      <path d="M242 238 L270 238 L262 212 L250 212 Z" fill="url(#castle)"/>
    </g>

    <!-- шпиль и маяк -->
    <path d="M251 212 L261 212 L256 168 Z" fill="#6b5b9e"/>
    <circle cx="256" cy="164" r="7" fill="#ff5f4d"/>
    <circle cx="256" cy="164" r="13" fill="#ff5f4d" opacity="0.35"/>

    <!-- окна-огни -->
    <g fill="#ffd27a">
      <rect x="200" y="366" width="7" height="5" rx="1"/>
      <rect x="240" y="366" width="7" height="5" rx="1"/>
      <rect x="286" y="366" width="7" height="5" rx="1"/>
      <rect x="320" y="366" width="7" height="5" rx="1"/>
      <rect x="216" y="336" width="6" height="5" rx="1"/>
      <rect x="258" y="336" width="6" height="5" rx="1"/>
      <rect x="296" y="336" width="6" height="5" rx="1"/>
      <rect x="230" y="306" width="6" height="4" rx="1"/>
      <rect x="272" y="306" width="6" height="4" rx="1"/>
      <rect x="246" y="276" width="5" height="4" rx="1"/>
      <rect x="264" y="246" width="5" height="4" rx="1"/>
    </g>

    <!-- облака -->
    <g fill="#f6e5ff" opacity="0.8">
      <ellipse cx="120" cy="404" rx="64" ry="15"/>
      <ellipse cx="170" cy="418" rx="46" ry="12"/>
      <ellipse cx="396" cy="410" rx="58" ry="14"/>
      <ellipse cx="344" cy="424" rx="42" ry="11"/>
    </g>
    <g fill="#ffffff" opacity="0.5">
      <ellipse cx="92" cy="396" rx="30" ry="9"/>
      <ellipse cx="420" cy="400" rx="26" ry="8"/>
    </g>

    <!-- лепестки сакуры -->
    <g fill="#ff9ec4">
      <ellipse cx="96" cy="260" rx="7" ry="4" transform="rotate(-30 96 260)" opacity="0.9"/>
      <ellipse cx="136" cy="310" rx="6" ry="3.6" transform="rotate(20 136 310)" opacity="0.8"/>
      <ellipse cx="404" cy="286" rx="7" ry="4" transform="rotate(35 404 286)" opacity="0.85"/>
      <ellipse cx="436" cy="330" rx="5.4" ry="3.2" transform="rotate(-18 436 330)" opacity="0.7"/>
    </g>

    <!-- нижняя градиент-полоса бренда -->
    <rect x="0" y="484" width="512" height="28" fill="url(#glow)"/>
  </g>
</svg>
